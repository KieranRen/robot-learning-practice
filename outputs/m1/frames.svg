<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title description">
  <title id="title">Coordinate frames W, A and B</title>
  <desc id="description">XY slice in metres. Positive z points out of the page. The computed point in W is compared with an incorrectly reversed matrix product.</desc>
  <rect width="960" height="640" fill="white" />
  <g font-family="sans-serif" fill="#0f172a">
    <text x="32" y="38" font-size="26">Coordinate frames: W / A / B</text>
    <text x="32" y="68" font-size="15">XY slice | right-handed frames | positions: m | angles: rad | +z out of page</text>
    <rect x="70" y="100" width="555" height="465" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
    <line id="grid-x-0" x1="140" x2="140" y1="105" y2="550" stroke="#e2e8f0" />
    <text x="136" y="585" font-size="13">0</text>
    <line id="grid-x-1" x1="300" x2="300" y1="105" y2="550" stroke="#e2e8f0" />
    <text x="296" y="585" font-size="13">1</text>
    <line id="grid-x-2" x1="460" x2="460" y1="105" y2="550" stroke="#e2e8f0" />
    <text x="456" y="585" font-size="13">2</text>
    <line x1="85" x2="615" y1="500" y2="500" stroke="#e2e8f0" />
    <text x="40" y="505" font-size="13">-1</text>
    <line x1="85" x2="615" y1="340" y2="340" stroke="#e2e8f0" />
    <text x="40" y="345" font-size="13">0</text>
    <line x1="85" x2="615" y1="180" y2="180" stroke="#e2e8f0" />
    <text x="40" y="185" font-size="13">1</text>
    <text x="550" y="585" font-size="13">x_W (m)</text>
    <text x="22" y="97" font-size="13">y_W (m)</text>
    <g id="frame-W">
      <circle cx="140" cy="340" r="4" fill="#334155" />
      <line id="axis-W-x" x1="140" y1="340" x2="207.2" y2="340" stroke="#334155" stroke-width="3" marker-end="url(#arrow-W)" />
      <line id="axis-W-y" x1="140" y1="340" x2="140" y2="272.8" stroke="#334155" stroke-width="3" marker-end="url(#arrow-W)" />
    </g>
    <text x="214.2" y="333" font-size="14" fill="#334155">x_W</text>
    <text x="147" y="265.8" font-size="14" fill="#334155">y_W</text>
    <text x="132" y="365" font-size="18" fill="#334155">W</text>
    <g id="frame-A">
      <circle cx="300" cy="340" r="4" fill="#2563eb" />
      <line id="axis-A-x" x1="300" y1="340" x2="300" y2="272.8" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-A)" />
      <line id="axis-A-y" x1="300" y1="340" x2="232.8" y2="340" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-A)" />
    </g>
    <text x="307" y="265.8" font-size="14" fill="#2563eb">x_A</text>
    <text x="239.8" y="361" font-size="14" fill="#2563eb">y_A</text>
    <text x="292" y="365" font-size="18" fill="#2563eb">A</text>
    <g id="frame-B">
      <circle cx="300" cy="180" r="4" fill="#9333ea" />
      <line id="axis-B-x" x1="300" y1="180" x2="367.2" y2="180" stroke="#9333ea" stroke-width="3" marker-end="url(#arrow-B)" />
      <line id="axis-B-y" x1="300" y1="180" x2="300" y2="112.8" stroke="#9333ea" stroke-width="3" marker-end="url(#arrow-B)" />
    </g>
    <text x="374.2" y="173" font-size="14" fill="#9333ea">x_B</text>
    <text x="307" y="105.8" font-size="14" fill="#9333ea">y_B</text>
    <text x="292" y="205" font-size="18" fill="#9333ea">B</text>
    <circle id="point-world" cx="460" cy="180" r="7" fill="#047857" data-world-x="2" data-world-y="1" data-world-z="0" />
    <text x="473" y="185" font-size="14" fill="#047857">p_W</text>
    <circle id="point-reversed" cx="460" cy="500" r="7" fill="#c2410c" data-world-x="2" data-world-y="-1" data-world-z="0" />
    <text x="473" y="505" font-size="14" fill="#c2410c">reversed order</text>
    <text x="655" y="125" font-size="20">Computed scene</text>
    <text x="655" y="162" font-size="14">T_wa: Rz(+pi/2), t=(1,0,0) m</text>
    <text x="655" y="195" font-size="14">T_ab: Rz(-pi/2), t=(1,0,0) m</text>
    <text x="655" y="228" font-size="14">A in W: (1, 0, 0) m</text>
    <text x="655" y="261" font-size="14">B in W: (1, 1, 0) m</text>
    <text x="655" y="294" font-size="14">p_B = (1, 0, 0) m</text>
    <text x="655" y="327" font-size="14">p_W = (2, 1, 0) m</text>
    <text x="655" y="360" font-size="14">reversed = (2, -1, 0) m</text>
    <text x="655" y="425" font-size="16">Max round-trip error</text>
    <text x="655" y="453" font-size="20">0.000e+00 m</text>
    <text x="655" y="495" font-size="13">T_wa @ T_ab matches subscripts.</text>
    <text x="655" y="522" font-size="13">The reversed product is a numeric</text>
    <text x="655" y="543" font-size="13">counterexample, not a frame chain.</text>
    <text x="32" y="620" font-size="14">Planar illustration of rigid transforms; no robot model or simulator is used.</text>
  </g>
  <defs>
    <marker id="arrow-W" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <marker id="arrow-A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea" />
    </marker>
  </defs>
</svg>
